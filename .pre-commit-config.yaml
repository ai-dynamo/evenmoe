default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX header
        entry: env SPDX_ALLOWED="Apache-2.0 MIT" tools/check_spdx.py
        language: system
        files: (\.(c|cc|cpp|h|hpp|cu|cuh|py|sh|go|rs|toml|ya?ml|in)|CMakeLists\.txt)$
        exclude: ^(third_party|vendor)/
      - id: dco-signoff
        name: DCO sign-off
        entry: tools/check_signoff.sh
        language: script
        stages: [commit-msg]
