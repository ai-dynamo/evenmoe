[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evenmoe"
version = "0.1.0"
description = "Framework-decoupled expert placement and token routing for Mixture-of-Experts inference."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "NVIDIA Corporation" }]
requires-python = ">=3.10"
keywords = [
    "mixture-of-experts",
    "load-balancing",
    "inference",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nvidia-mathdx==25.6.0",
    "torch>=2.5",
    "triton>=3.0",
    "apache-tvm-ffi>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/ai-dynamo/evenmoe"
Repository = "https://github.com/ai-dynamo/evenmoe"
Issues = "https://github.com/ai-dynamo/evenmoe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evenmoe.kernels.jit" = ["include/evenmoe_jit/*"]
"evenmoe.kernels.lplb" = ["csrc/*.cuh"]
"evenmoe.kernels.ultraep" = [
    "LICENSE.ultraep",
    "csrc/*.cuh",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: framework-neutral core/contract tests",
    "integration: tests that touch adapter glue or external frameworks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
packages = ["evenmoe"]
ignore_missing_imports = true

[tool.uv]
managed = true
