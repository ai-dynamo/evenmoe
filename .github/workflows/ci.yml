#
# Pre-merge gate: lint + type check + unit tests + build smoke.
# Runs on GitHub-hosted runners (no GPU), so it is safe to run on every PR,
# including forks. GPU tests live in gpu-ci.yml and run only after copy-pr-bot
# mirrors a vetted PR to a pull-request/<N> branch.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel stale runs on the same PR; keep runs on main as the record of what shipped.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          python -m pip install "triton>=3.0" ruff mypy pytest
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src/evenmoe

      - name: Unit tests
        run: python -m pytest -m "not integration" --junitxml=unit-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-py${{ matrix.python-version }}
          path: unit-report.xml

  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Smoke the built wheel
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import evenmoe; print('wheel import OK:', evenmoe.__name__)"

  # Single required check for branch protection; matrix job names change with
  # the Python versions, this one does not.
  ci-status-check:
    name: CI status
    runs-on: ubuntu-24.04
    needs: [test, build]
    if: always()
    steps:
      - name: Check all dependent jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'
