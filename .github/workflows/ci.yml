# SPDX-License-Identifier: Apache-2.0
#
# Simplified pre-merge gate: lint + type check + unit tests + build smoke.
# Single file, no reusable workflow, no change-set classification, no aggregate
# status job. The full gate lives in ci.yml; this file is for fast iteration.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel stale runs on the same PR; keep runs on main as the record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5"
          python -m pip install "triton>=3.0" ruff mypy pytest
          python -m pip install -e . --no-deps

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src/moe_load_balancer

      - name: Unit tests
        run: python -m pytest -m "not integration"

  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Smoke the built wheel
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall --no-deps dist/*.whl
          # Resolve the package from site-packages, not the checkout.
          cd /tmp
          python -c "import moe_load_balancer; print('wheel import OK:', moe_load_balancer.__name__)"
